<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LostIntoSpacE">
  <title>LostIntoSpacE</title>

  <!--
    The mark: a vehicle on ascent, drawn over the limb of the world it is
    leaving, inside an instrument aperture.

    Three things had to be true. It has to read at 16 px, where only the
    silhouette survives — so the rocket is a solid, chunky shape and the limb is
    a single hard edge. It has to reward a second look at 512 px, which is what
    the graticule, the terminator shading, the stage line and the plume core are
    for. And it has to be built from the product's own vocabulary: the warm
    neutral ground, the flame that means propulsion, the iron-oxide world, and
    the one warm light source from the upper left that every surface in this
    interface is lit by.
  -->

  <defs>
    <clipPath id="aperture">
      <rect x="0" y="0" width="64" height="64" rx="13"/>
    </clipPath>

    <!-- The world: lit from the upper left, terminator falling to the right. -->
    <linearGradient id="limb" x1="0.15" y1="0" x2="0.9" y2="0.85">
      <stop offset="0" stop-color="#C9633A"/>
      <stop offset="0.45" stop-color="#B4552F"/>
      <stop offset="1" stop-color="#3E1E12"/>
    </linearGradient>

    <!-- Atmospheric scattering along the limb edge. -->
    <linearGradient id="airglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB07A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFB07A" stop-opacity="0"/>
    </linearGradient>

    <!-- The plume: white-hot at the throat, cooling as it expands. -->
    <linearGradient id="plume" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3DC"/>
      <stop offset="0.3" stop-color="#FA8A4A"/>
      <stop offset="1" stop-color="#E4682E" stop-opacity="0"/>
    </linearGradient>

    <!-- The airframe, so the body reads as a cylinder rather than a bar. -->
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E8880"/>
      <stop offset="0.34" stop-color="#F4F0E8"/>
      <stop offset="0.72" stop-color="#CAC3B7"/>
      <stop offset="1" stop-color="#6B655C"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#aperture)">
    <!-- Ground: the warm neutral void this whole system sits on. -->
    <rect width="64" height="64" fill="#060605"/>

    <!-- Instrument graticule. Present, not assertive. -->
    <g stroke="#F4F0E8" stroke-width="0.5" fill="none" opacity="0.10">
      <circle cx="32" cy="32" r="25"/>
      <circle cx="32" cy="32" r="16.5"/>
    </g>
    <g stroke="#F4F0E8" stroke-width="0.5" opacity="0.16">
      <path d="M32 4.5v4M32 55.5v4M4.5 32h4M55.5 32h4"/>
    </g>

    <!-- Stars. A real magnitude distribution: mostly faint, one bright. -->
    <g fill="#F4F0E8">
      <circle cx="12" cy="13" r="1.15" opacity="0.92"/>
      <circle cx="49.5" cy="9.5" r="0.7" opacity="0.6"/>
      <circle cx="55" cy="22" r="0.5" opacity="0.4"/>
      <circle cx="9" cy="27" r="0.5" opacity="0.42"/>
      <circle cx="41" cy="5.5" r="0.45" opacity="0.35"/>
    </g>

    <!-- The world, cropped by the aperture so it reads as a limb, not a ball. -->
    <circle cx="32" cy="79" r="35" fill="url(#limb)"/>
    <path d="M-3 44.6a35 35 0 0 1 70 0Z" fill="url(#airglow)" opacity="0.5"/>
    <circle cx="32" cy="79" r="35" fill="none" stroke="#FFC49A" stroke-width="0.7" opacity="0.55"/>

    <!--
      The trajectory. A gravity turn: vertical off the pad, then bending
      downrange — the actual shape of the ascent this product simulates, not a
      decorative swoosh.
    -->
    <path d="M21.5 47.5C21.5 38 23 30 30.5 24.5"
          fill="none" stroke="#E4682E" stroke-width="1.1"
          stroke-linecap="round" stroke-dasharray="2 2.6" opacity="0.6"/>

    <!-- The vehicle, pitched over onto its trajectory. -->
    <g transform="rotate(31 34 22)">
      <!-- Exhaust plume, behind the hull. -->
      <path d="M31.4 30.2h5.2l-2.6 12z" fill="url(#plume)"/>
      <path d="M32.6 30.2h2.8l-1.4 6.4z" fill="#FFF6E4" opacity="0.95"/>

      <!-- Fins. -->
      <path d="M31.5 24.4l-4.2 5.1v-4.2l4.2-3.3z" fill="#8A3F1C"/>
      <path d="M36.5 24.4l4.2 5.1v-4.2l-4.2-3.3z" fill="#5E2A12"/>

      <!-- Body, and the line where the second stage sits on the first. -->
      <path d="M31.4 13.4h5.2v16.8h-5.2z" fill="url(#hull)"/>
      <path d="M31.4 21.2h5.2" stroke="#4A453C" stroke-width="0.7"/>

      <!-- Engine bell. -->
      <path d="M31.9 30.2h4.2l1 2.1h-6.2z" fill="#6D7176"/>

      <!-- Nose cone: an ogive, which is the profile the drag model assumes. -->
      <path d="M34 5.6c1.9 2.4 2.6 5.1 2.6 7.8h-5.2c0-2.7.7-5.4 2.6-7.8z" fill="#F4F0E8"/>

      <!-- Payload window, and the specular highlight the light source implies. -->
      <circle cx="34" cy="17.2" r="1.15" fill="#7FA8B8"/>
      <path d="M32.2 14.2v13.6" stroke="#FFFFFF" stroke-width="0.55" opacity="0.5"/>
    </g>
  </g>
</svg>
